plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ygoleague'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.sqids:sqids:0.1.0'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // Repository tests run Flyway + Hibernate validation against a throwaway Postgres (needs Docker).
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ./gradlew bootRun -Pdev  runs with the dev profile: dev login, seeded test users and league.
tasks.named('bootRun') {
    if (project.hasProperty('dev')) args '--spring.profiles.active=dev'
}

tasks.named('test') {
    useJUnitPlatform()
}

// One-shot catalog sync from YGOPRODeck, then exit. Add -Pforce to re-import an unchanged version.
tasks.register('syncCatalog', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Sync the card catalog from YGOPRODeck, then exit.'
    mainClass = 'com.ygoleague.LeagueApplication'
    classpath = sourceSets.main.runtimeClasspath
    args '--app.catalog.sync-and-exit=true', '--spring.main.web-application-type=none'
    if (project.hasProperty('force')) args '--app.catalog.sync.force=true'
}

// Import the curated official ban lists, then exit (1 if any card name doesn't match the catalog).
tasks.register('importBanLists', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Import official ban list YAML files into the local DB, then exit.'
    mainClass = 'com.ygoleague.LeagueApplication'
    classpath = sourceSets.main.runtimeClasspath
    args '--app.banlists.import-and-exit=true', '--spring.main.web-application-type=none'
}
