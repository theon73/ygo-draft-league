spring:
  application:
    name: ygo-league
  # Local secrets (GOOGLE_CLIENT_ID, ...) can live in backend/.env, which is gitignored.
  # app.env-file moves it; the test task points it at a missing file so tests never see secrets.
  config:
    import: optional:file:${app.env-file:.env}[.properties]
  autoconfigure:
    # Boot would otherwise create a password user with a generated password. Logins are OAuth only.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ygoleague}
    username: ${DB_USER:ygoleague}
    password: ${DB_PASSWORD:ygoleague}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never   # tables come from Flyway (V6__http_sessions.sql)

server:
  port: 8080
  servlet:
    session:
      # Stay signed in while you use the site at least once a month (idle timeout, refreshed on
      # every request). The cookie itself is an absolute cap: sign in again every 90 days.
      timeout: 30d
      cookie:
        max-age: 90d
        http-only: true          # not readable by JavaScript
        same-site: lax           # not sent on cross-site POSTs; still sent on the Google redirect back
        secure: ${SESSION_COOKIE_SECURE:false}   # MUST be true in production (HTTPS only)

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    google:
      # "Sign in with Google" is enabled only when the client id is set (see auth.GoogleLogin).
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Site admins as provider:subject, comma-separated. Your own identity is shown by
    # GET /api/auth/session once you're signed in. Config only, never the DB (see AdminAllowlist).
    admins: ${APP_ADMINS:}
  catalog:
    ygoprodeck:
      base-url: https://db.ygoprodeck.com/api/v7
    sync:
      scheduled: true
      cron: "0 0 9 * * MON"   # Mondays 09:00 UTC; skipped cheaply if YGOPRODeck hasn't changed
  images:
    # Card image cache (see image.CardImageService and PLANNING.md "Card images").
    store: local                                   # local disk now; R2 later
    local-dir: ${CARD_IMAGE_DIR:data/card-images}  # relative to backend/; gitignored
    upstream-base-url: https://images.ygoprodeck.com/images
    fetches-per-second: 5                          # one throttle for the whole app
  banlists:
    location: "classpath*:banlists/**/*.yaml"   # curated official lists (see OfficialBanListFile)
    import-on-startup: true
  public-ids:
    # Sqids settings for opaque URL ids (see PublicIds). PERMANENT: changing either value
    # changes every public id and breaks all existing links. Not a secret.
    alphabet: CS4A2WEpasq9JOlUgv0Fy7tnh8orReBPwXd1juimbkGD6VNZTIKfx5zHcLQ3YM
    min-length: 8
