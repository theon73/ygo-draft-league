spring:
  application:
    name: ygo-league
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ygoleague}
    username: ${DB_USER:ygoleague}
    password: ${DB_PASSWORD:ygoleague}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  public-ids:
    # Sqids settings for opaque URL ids (see PublicIds). PERMANENT: changing either value
    # changes every public id and breaks all existing links. Not a secret.
    alphabet: CS4A2WEpasq9JOlUgv0Fy7tnh8orReBPwXd1juimbkGD6VNZTIKfx5zHcLQ3YM
    min-length: 8
